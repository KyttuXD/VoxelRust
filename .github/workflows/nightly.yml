# Builds VoxelRust for Linux, Windows and macOS (Intel, 10.6+ and 10.12+) and publishes the files to the rolling
# pre-release "nightly" in Releases (not Actions artifacts). The release is created on first use, its tag is moved to
# the commit that was built, and the files are replaced in place, so it always holds the latest build.
#
# Everything is built on one Linux runner: the Windows and macOS programs are cross-built with the linker that ships
# inside the Rust toolchain (rust-lld), without Visual Studio, a Windows SDK, Xcode or an Apple SDK
# (scripts/build-windows.sh, scripts/build-macos-legacy.sh, docs/PORTING.md).
#
# Runs every night (03:00 UTC) and by hand from the Actions tab ("nightly", Run workflow). The nightly run is skipped
# when the "nightly" tag already points at the newest commit; a run started by hand always builds.
name: nightly
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RUST_TOOLCHAIN: stable
  NIGHTLY_TAG: nightly
  NIGHTLY_TITLE: Nightly build
  NIGHTLY_NOTES: Rebuilt every night when the code has changed. The files are replaced in place. SDL2 is not included, see README.md.

jobs:
  # Is there anything new to build? Compares the commit the "nightly" tag points at with the commit of this run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$NIGHTLY_TAG" --jq .object.sha 2>/dev/null || true)
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new since the last nightly ($GITHUB_SHA): skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc,x86_64-apple-darwin

      # Compiled code is kept between runs (keyed on the lock file and the sources' hash), so a nightly after a
      # small change rebuilds one crate, not four targets from nothing.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'build.rs') }}-${{ github.sha }}
          restore-keys: |
            nightly-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'build.rs') }}-
            nightly-${{ runner.os }}-

      - name: cargo test --lib
        run: cargo test --lib

      # One script builds Linux, Windows, both Mac versions and the browser version, and lays out the release:
      # archives for people, bare programs and nightly.txt for the game's own updater (see the script's header).
      - name: Build and package (scripts/package-release.sh)
        run: |
          rustup target add wasm32-unknown-unknown
          sh scripts/package-release.sh
          {
            echo "### Nightly files ($GITHUB_SHA)"
            echo
            echo '```'
            cat dist/nightly/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Only the default branch is published; a run started by hand on another branch builds and stops here.
      - name: Publish to nightly
        if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          i=0
          until gh release view "$NIGHTLY_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do
            i=$((i + 1))
            if [ "$i" -gt 6 ]; then
              echo "could not create the $NIGHTLY_TAG release" >&2
              exit 1
            fi
            gh release create "$NIGHTLY_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "$NIGHTLY_TITLE" --notes "$NIGHTLY_NOTES" >/dev/null 2>&1 || sleep 5
          done
          # Point the tag at this commit, so the release matches the files uploaded below.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$NIGHTLY_TAG" -f sha="$GITHUB_SHA" -F force=true >/dev/null 2>&1 || true
          gh release upload "$NIGHTLY_TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/nightly/*
          echo "uploaded the nightly files to the $NIGHTLY_TAG release ($GITHUB_SHA)"
          echo "- release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$NIGHTLY_TAG (commit $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
